        const MASTER_KEY = "Football@b7"; 
        const IMAGE_SIZE_LIMIT_KB = 700;
        
        const getTodayDate = () => {
            const d = new Date();
            let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        const DEFAULT_CONFIG = { 
            title: 'مباراة ودية', 
            maxPlayers: 12, 
            matchDate: getTodayDate(),
            startTime: '20:00', 
            endTime: '21:00', 
            totalCost: 100, 
            adminPassword: '', 
            currency: 'RM', 
            paymentInfoImage: null,
            withdrawalTime: `${getTodayDate()}T18:00`,
            location: ''
        };

        const { useState, useEffect, useRef } = React;

        function App() {
            // App State
            const [view, setView] = useState('LOADING'); 
            const [bookingId, setBookingId] = useState(null);
            const [user, setUser] = useState(null);
            
            // Data
            const [players, setPlayers] = useState([]);
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [myBookings, setMyBookings] = useState([]);
            const [allMatches, setAllMatches] = useState([]);

            // UI
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminAuth, setShowAdminAuth] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [newPasswordInput, setNewPasswordInput] = useState('');
            
            // New Player Registration Data
            const [newName, setNewName] = useState('');
            const [newPosition, setNewPosition] = useState('هجوم');
            const [newLevel, setNewLevel] = useState('متوسط');

            const [toast, setToast] = useState(null);
            const [timeLeft, setTimeLeft] = useState('');
            
            // Modals
            const [viewImage, setViewImage] = useState(null);
            const [showTeamGen, setShowTeamGen] = useState(false);
            const [teamCount, setTeamCount] = useState(2); 
            const [showCreateModal, setShowCreateModal] = useState(false);
            
            // Create Modal State
            const [newBookingConfig, setNewBookingConfig] = useState({ title: 'مباراة ودية', customId: '', password: '' });
            const [shareMsg, setShareMsg] = useState('');
            const [showManualShare, setShowManualShare] = useState(false);
            const [joinCodeInput, setJoinCodeInput] = useState('');
            const [createPassShow, setCreatePassShow] = useState(false); 
            const [titleClicks, setTitleClicks] = useState(0);

            const isInitialLoad = useRef(true);
            const fileInputRef = useRef(null);

            const showToast = (msg, type = 'error') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const safePushState = (data, title, url) => {
                try {
                    window.history.pushState(data, title, url);
                } catch (e) {
                    console.warn("PushState failed:", e);
                }
            };
            
            const formatTime = (timeStr) => {
                if (!timeStr) return '';
                if (timeStr.includes('T')) {
                    const dateObj = new Date(timeStr);
                    if (isNaN(dateObj.getTime())) return timeStr;
                    return dateObj.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: 'numeric', hour12: true });
                }
                const [hour, minute] = timeStr.split(':');
                const h = parseInt(hour, 10);
                const ampm = h >= 12 ? 'PM' : 'AM';
                const h12 = h % 12 || 12;
                return `${h12}:${minute} ${ampm}`;
            };

            const isStrongPassword = (password) => {
                const hasUpperCase = /[A-Z]/.test(password);
                const hasLowerCase = /[a-z]/.test(password);
                const hasNumber = /[0-9]/.test(password);
                const isLongEnough = password.length >= 8;
                return isLongEnough && hasUpperCase && hasLowerCase && hasNumber;
            };

            // Countdown Effect
            useEffect(() => {
                if (view !== 'BOOKING' || !config.matchDate || !config.startTime) return;
                const timer = setInterval(() => {
                    const now = new Date();
                    const matchStart = new Date(`${config.matchDate}T${config.startTime}`);
                    if (isNaN(matchStart.getTime())) return; 
                    const diff = matchStart - now;
                    if (diff <= 0) {
                        setTimeLeft('المباراة بدأت ⚽');
                    } else {
                        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                        let timeString = '';
                        if (days > 0) timeString += `${days}يوم `;
                        timeString += `${hours}س ${minutes}د ${seconds}ث`;
                        setTimeLeft(timeString);
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [view, config.matchDate, config.startTime]);

            useEffect(() => {
                const history = JSON.parse(localStorage.getItem('bookingHistory') || '[]');
                setMyBookings(history);
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');
                auth.signInAnonymously().catch(err => console.error(err));
                return auth.onAuthStateChanged(u => {
                    setUser(u);
                    if (id) { setBookingId(id); setView('BOOKING'); } else { setView('HOME'); }
                });
            }, []);

            useEffect(() => {
                if (!user || view !== 'BOOKING' || !bookingId) return;
                isInitialLoad.current = true;
                const playersRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${bookingId}`);
                const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('booking_configs').doc(bookingId);

                const unsubP = playersRef.onSnapshot(snap => setPlayers(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                
                const unsubC = configRef.onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setConfig({ ...DEFAULT_CONFIG, ...data });
                        isInitialLoad.current = false; 
                    } else { 
                        if (!isInitialLoad.current) {
                            setIsAdmin(false); 
                            alert("تم إلغاء المباراة من قبل المشرف.");
                            const history = JSON.parse(localStorage.getItem('bookingHistory') || '[]');
                            const newHistory = history.filter(b => b.id !== bookingId);
                            localStorage.setItem('bookingHistory', JSON.stringify(newHistory));
                            setMyBookings(newHistory);
                            goHome();
                        } else {
                            alert("هذا الحجز غير موجود أو تم حذفه.");
                            goHome();
                        }
                        isInitialLoad.current = false;
                    }
                });
                return () => { unsubP(); unsubC(); };
            }, [user, view, bookingId]);

            useEffect(() => {
                if (view === 'HOME' && isAdmin) {
                    loadAllMatches();
                }
            }, [view, isAdmin]);

            const loadAllMatches = async () => {
                try {
                    const snapshot = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('booking_configs').get();
                    const matches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setAllMatches(matches);
                } catch (error) {
                    console.error("Error loading matches", error);
                    showToast("Could not load matches", "error");
                }
            };
            
            const deleteExpiredMatches = async () => {
                if (!confirm("هل أنت متأكد من حذف جميع المباريات القديمة؟")) return;
                const today = new Date().toISOString().split('T')[0];
                const expired = allMatches.filter(m => m.matchDate < today);
                
                if (expired.length === 0) return showToast("لا توجد مباريات قديمة", "error");

                let count = 0;
                for (const match of expired) {
                     const playersSnap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${match.id}`).get();
                     const batch = db.batch();
                     playersSnap.forEach(doc => batch.delete(doc.ref));
                     await batch.commit();
                     await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('booking_configs').doc(match.id).delete();
                     count++;
                }
                showToast(`تم حذف ${count} مباراة قديمة بنجاح`, "success");
                loadAllMatches();
            };

            const goHome = () => { 
                setView('HOME'); 
                setBookingId(null); 
                setIsAdmin(false);
                safePushState({}, '', window.location.pathname); 
            };

            const joinMatch = async () => {
                if (!joinCodeInput.trim()) return showToast("الرجاء إدخال رمز المباراة", "error");
                const code = joinCodeInput.trim();
                try {
                    const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('booking_configs').doc(code);
                    const docSnap = await docRef.get();
                    if (!docSnap.exists) {
                        return showToast("الرمز خاطئ، تأكد منه وحاول مجدداً", "error");
                    }
                    setBookingId(code);
                    setView('BOOKING');
                    const newUrl = `${window.location.pathname}?id=${code}`;
                    safePushState({path: newUrl}, '', newUrl);
                    if (!myBookings.find(b => b.id === code)) {
                         const data = docSnap.data();
                         const newHistory = [{ id: code, title: data.title, date: data.matchDate || new Date().toLocaleDateString() }, ...myBookings];
                         localStorage.setItem('bookingHistory', JSON.stringify(newHistory));
                         setMyBookings(newHistory);
                    }
                } catch (error) {
                    console.error("Join Error:", error);
                    showToast("حدث خطأ أثناء الاتصال", "error");
                }
            };

            const startCreateProcess = () => {
                setNewBookingConfig({ title: 'مباراة ودية', customId: '', password: '' }); 
                setShowCreateModal(true);
            };
            
            const confirmCreateBooking = async () => {
                if (!user) return showToast("جاري الاتصال...", "error");
                if (!isStrongPassword(newBookingConfig.password)) {
                     showToast("كلمة المرور يجب أن تحتوي على 8 خانات، حرف كبير، حرف صغير، ورقم.", "error");
                     return;
                }
                let newId = newBookingConfig.customId.trim();
                if (!newId) {
                     newId = Math.random().toString(36).substring(2, 10);
                } else {
                    newId = newId.replace(/[^a-zA-Z0-9-_]/g, '');
                    if (!newId) return showToast("رموز غير صالحة في رمز المباراة", "error");
                }
                
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('booking_configs').doc(newId);
                const docSnap = await docRef.get();
                if (docSnap.exists) return showToast("هذا الرمز محجوز مسبقاً، اختر غيره!", "error");
                
                setShowCreateModal(false);
                const now = Date.now();
                
                try {
                    await docRef.set({
                        ...DEFAULT_CONFIG,
                        title: newBookingConfig.title,
                        adminPassword: newBookingConfig.password, 
                        createdAt: now, 
                        createdBy: user.uid,
                        withdrawalTime: `${getTodayDate()}T18:00` 
                    });
                    const newHistory = [{ id: newId, title: newBookingConfig.title, date: new Date().toLocaleDateString(), timestamp: now }, ...myBookings];
                    localStorage.setItem('bookingHistory', JSON.stringify(newHistory));
                    setMyBookings(newHistory);
                    setBookingId(newId); 
                    setIsAdmin(true); 
                    setView('BOOKING');
                    const newUrl = `${window.location.pathname}?id=${newId}`;
                    safePushState({path: newUrl}, '', newUrl);
                } catch (e) { 
                    showToast("Error: " + e.message, "error"); 
                }
            };
            
            const deleteHistory = (idx) => {
                if(!confirm("إزالة من السجل؟")) return;
                const h = [...myBookings]; h.splice(idx, 1); setMyBookings(h);
                localStorage.setItem('bookingHistory', JSON.stringify(h));
            };
            const clearAllHistory = () => {
                if(!confirm("مسح جميع السجلات؟")) return;
                setMyBookings([]); localStorage.removeItem('bookingHistory');
            };
            
            const adminLogin = (e) => {
                e.preventDefault();
                const currentPass = config.adminPassword;
                if (passwordInput === currentPass || passwordInput === MASTER_KEY) { 
                    setIsAdmin(true); 
                    setShowAdminAuth(false); 
                    setPasswordInput(''); 
                } else { 
                    showToast("كلمة المرور خاطئة", "error");
                }
            };

            const homeAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === MASTER_KEY) {
                    setIsAdmin(true);
                    setShowAdminAuth(false);
                    setPasswordInput('');
                    loadAllMatches(); 
                } else {
                    showToast("المفتاح العام خاطئ", "error");
                }
            };
            
            const handleTitleClick = () => {
                const newCount = titleClicks + 1;
                setTitleClicks(newCount);
                if (newCount >= 5) {
                    setShowAdminAuth(true);
                    setTitleClicks(0);
                }
            };

            const updateSetting = (k, v) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('booking_configs').doc(bookingId).update({ [k]: v });
            
            const changeAdminPassword = () => {
                if (!isStrongPassword(newPasswordInput)) {
                    return showToast("كلمة المرور يجب أن تحتوي على 8 خانات، حرف كبير، حرف صغير، ورقم.", "error");
                }
                updateSetting('adminPassword', newPasswordInput); 
                setNewPasswordInput(''); 
                showToast("تم تحديث كلمة المرور", "success");
            };

            const uploadImage = (file, field, docId = null) => {
                if (!file || file.size > IMAGE_SIZE_LIMIT_KB * 1024) return showToast("حجم الصورة كبير جداً", "error");
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64 = e.target.result;
                    if (field === 'paymentInfoImage') updateSetting('paymentInfoImage', base64);
                    else if (field === 'proof' && docId) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${bookingId}`).doc(docId).update({ paymentProof: base64 });
                    showToast("تم رفع الصورة!", "success");
                };
                reader.readAsDataURL(file);
            };

            // ADD PLAYER WITH NEW FIELDS
            const addPlayer = async (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                if (!isAdmin && players.find(p => p.createdBy === user.uid)) return showToast("لقد قمت بالتسجيل مسبقاً!", "error");
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${bookingId}`).add({ 
                    name: newName.trim(), 
                    position: newPosition, // Save chosen position
                    level: newLevel,       // Save chosen level
                    isPaid: false, 
                    createdAt: Date.now(), 
                    createdBy: user.uid, 
                    paymentProof: null 
                });
                setNewName('');
            };

            const togglePaid = (p) => {
                db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${bookingId}`).doc(p.id).update({ isPaid: !p.isPaid })
                .catch(err => showToast("خطأ: " + err.message, "error"));
            };
            
            const deletePlayer = (id) => {
                if (!isAdmin) {
                    const deadlineStr = `${config.matchDate}T${config.withdrawalTime}`;
                    const deadline = new Date(deadlineStr).getTime();
                    if (!isNaN(deadline) && Date.now() > deadline) {
                         return showToast(`لا يمكنك الانسحاب، انتهى الوقت المسموح`, "error");
                    }
                }
                if(confirm("تأكيد الحذف؟")) {
                    db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${bookingId}`).doc(id).delete()
                    .catch(err => showToast("خطأ في الحذف: " + err.message, "error"));
                }
            };
            
            const deleteBookingCompletely = async (idToDelete = bookingId) => {
                if (!confirm("تحذير: هل أنت متأكد من حذف هذه المباراة نهائياً؟")) return;
                
                const playersSnap = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${idToDelete}`).get();
                const batch = db.batch();
                playersSnap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();

                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('booking_configs').doc(idToDelete).delete();
                
                const h = JSON.parse(localStorage.getItem('bookingHistory') || '[]');
                const newHistory = h.filter(b => b.id !== idToDelete);
                localStorage.setItem('bookingHistory', JSON.stringify(newHistory));
                setMyBookings(newHistory);

                if (idToDelete === bookingId) {
                    showToast("تم الحذف بنجاح!", "success"); 
                    goHome();
                } else {
                    loadAllMatches();
                    showToast("تم حذف المباراة", "success");
                }
            };

            const copyCode = () => {
                navigator.clipboard.writeText(bookingId).then(() => showToast("تم النسخ!", "success")).catch(() => prompt("Copy Code:", bookingId));
            };
            const copyLink = () => {
                const url = window.location.href;
                navigator.clipboard.writeText(url).then(() => {showToast('تم النسخ!', 'success')}).catch(() => setShowManualShare(true));
            };

            const shareToWhatsApp = () => {
                const text = `⚽ *دعوة لمباراة*\n\n🏆 المباراة: ${config.title}\n📅 التاريخ: ${config.matchDate}\n⏰ الوقت: ${formatTime(config.startTime)} - ${formatTime(config.endTime)}\n\n👇 اضغط على الرابط للتسجيل:\n${window.location.href}`;
                const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
                window.open(whatsappUrl, '_blank');
            };

            // SMART TEAM GENERATION (SNAKE DRAFT ALGORITHM)
            const generateTeamsSmart = () => {
                const active = players.sort((a,b) => a.createdAt - b.createdAt).slice(0, config.maxPlayers);
                if(active.length < teamCount) return showToast("عدد اللاعبين غير كافي!", "error");

                // 1. Initialize Teams
                const teams = Array.from({length: teamCount}, () => ({ players: [], score: 0, count: 0, posCount: {} }));
                
                // 2. Group by Position
                const groups = { 'حارس': [], 'دفاع': [], 'وسط': [], 'هجوم': [] };
                active.forEach(p => {
                    const pos = p.position || 'وسط';
                    if(groups[pos]) groups[pos].push(p);
                    else groups['وسط'].push(p);
                });

                // 3. Sort each group by skill (highest first)
                Object.keys(groups).forEach(pos => {
                    groups[pos].sort((a, b) => {
                        const levelA = a.level === 'محترف' ? 3 : a.level === 'متوسط' ? 2 : 1;
                        const levelB = b.level === 'محترف' ? 3 : b.level === 'متوسط' ? 2 : 1;
                        return levelB - levelA;
                    });
                });

                // 4. Snake Draft Distribution
                ['حارس', 'دفاع', 'وسط', 'هجوم'].forEach(pos => {
                    groups[pos].forEach(p => {
                        // ترتيب الفرق لمعرفة من يستحق اللاعب القادم
                        teams.sort((a, b) => {
                            // 1. الأولوية للفريق الذي لديه عدد أقل من هذا المركز
                            const aPos = a.posCount[pos] || 0;
                            const bPos = b.posCount[pos] || 0;
                            if (aPos !== bPos) return aPos - bPos;
                            
                            // 2. إذا تساووا في المركز، الأولوية للفريق الأقل في العدد الإجمالي
                            if (a.count !== b.count) return a.count - b.count;
                            
                            // 3. إذا تساووا في العدد، الأولوية للفريق الأضعف (نقاط القوة) لتعويضه!
                            return a.score - b.score;
                        });
                        
                        // إضافة اللاعب للفريق المستحق
                        teams[0].players.push(p);
                        
                        const pLevel = p.level === 'محترف' ? 3 : p.level === 'متوسط' ? 2 : 1;
                        // إضافة نقاط المهارة
                        // الحارس نعطيه وزن إضافي خفي لضمان تعويض الفريق الآخر
                        const weight = pos === 'حارس' ? pLevel + 2 : pLevel;
                        teams[0].score += weight;
                        teams[0].count += 1;
                        teams[0].posCount[pos] = (teams[0].posCount[pos] || 0) + 1;
                    });
                });

                // تنبيهات النقص (تضاف للرسالة تلقائياً)
                let alerts = "";
                if (groups['حارس'].length > 0 && groups['حارس'].length < teamCount) {
                    alerts += "⚠️ *تنبيه:* يوجد نقص في حراس المرمى، تم تعويض الفرق الأخرى بلاعبين ذوي مهارة أعلى لوزن القوة.\n\n";
                }

                // 5. Output Generation
                let msg = `⚽ *توزيع الفرق الذكي*\n\n${alerts}`;
                const posIcon = { 'حارس': '🧤', 'دفاع': '🛡️', 'وسط': '👟', 'هجوم': '⚔️' };
                
                // إعادة ترتيب الفرق بناءً على رقمها الأصلي
                teams.sort((a,b) => teams.indexOf(a) - teams.indexOf(b));

                teams.forEach((team, i) => {
                    // حساب القوة الفعلية للعرض (بدون الوزن الإضافي للحارس)
                    const displayScore = team.players.reduce((sum, p) => {
                        const lvl = p.level === 'محترف' ? 3 : p.level === 'متوسط' ? 2 : 1;
                        return sum + lvl;
                    }, 0);
                    msg += `🏆 *الفريق ${i+1}* (القوة: ${displayScore}):\n`;
                    
                    // ترتيب عرض اللاعبين داخل الفريق (حارس ثم دفاع ثم وسط ثم هجوم)
                    team.players.sort((a,b) => {
                        const order = {'حارس':1, 'دفاع':2, 'وسط':3, 'هجوم':4};
                        return (order[a.position] || 5) - (order[b.position] || 5);
                    }).forEach(p => {
                        const icon = posIcon[p.position] || '🏃';
                        const lvlVal = p.level === 'محترف' ? 3 : p.level === 'متوسط' ? 2 : 1;
                        const stars = "⭐".repeat(lvlVal);
                        msg += `- ${p.name} ${icon} (${stars})\n`;
                    });
                    msg += `\n`;
                });
                
                alert(msg);
                if(navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(msg).then(() => showToast("تم التوزيع ونسخ النتيجة!", "success")).catch(() => {});
                }
                setShowTeamGen(false);
            };

            const resetPlayersList = () => { 
                if(confirm('هل أنت متأكد من مسح جميع اللاعبين؟')) players.forEach(p=>db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`players_${bookingId}`).doc(p.id).delete()); 
            };

            if (view === 'LOADING') return <div className="flex h-screen items-center justify-center text-white font-bold">جاري التحميل...</div>;

            if (view === 'HOME') return (
                <div className="min-h-screen bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 relative">
                    
                    {!isAdmin && showAdminAuth && (
                        <div className="absolute top-20 right-4 bg-white p-3 rounded-xl shadow-2xl z-50 flex flex-col gap-2 w-72 max-w-[90vw] border border-gray-200 animate-fade-in">
                            <div className="relative flex items-center">
                                <input 
                                    type={showPassword ? "text" : "password"} 
                                    placeholder="المفتاح العام" 
                                    className="flex-1 p-2 border rounded text-black outline-none pr-10" 
                                    value={passwordInput} 
                                    onChange={e=>setPasswordInput(e.target.value)}
                                />
                                <button 
                                    onClick={() => setShowPassword(!showPassword)}
                                    className="absolute right-2 text-gray-500 hover:text-gray-700"
                                >
                                    {showPassword ? <Icons.EyeOff size={18}/> : <Icons.Eye size={18}/>}
                                </button>
                            </div>
                            <button onClick={homeAdminLogin} className="bg-indigo-900 text-white px-3 rounded font-bold py-2">دخول المشرف العام</button>
                             <button onClick={() => {setShowAdminAuth(false); setTitleClicks(0);}} className="text-xs text-gray-400 hover:text-gray-600 mt-1">إلغاء</button>
                        </div>
                    )}

                    {/* GLOBAL ADMIN DASHBOARD */}
                    {isAdmin ? (
                        <div className="bg-white/95 w-full max-w-2xl p-6 rounded-2xl shadow-2xl text-center relative z-10 h-[80vh] flex flex-col">
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h2 className="text-2xl font-bold text-indigo-900 flex items-center gap-2"><Icons.Database size={24}/> لوحة التحكم الشاملة</h2>
                                <div className="flex gap-2">
                                    <button onClick={deleteExpiredMatches} className="text-orange-600 font-bold text-xs border border-orange-200 px-2 py-1 rounded hover:bg-orange-50">تنظيف القديم</button>
                                    <button onClick={()=>setIsAdmin(false)} className="text-red-500 font-bold text-sm border border-red-200 px-2 py-1 rounded hover:bg-red-50">خروج</button>
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto" dir="rtl">
                                {allMatches.length === 0 ? (
                                    <div className="text-gray-400 py-10">لا توجد مباريات...</div>
                                ) : (
                                    <div className="space-y-2">
                                        {allMatches.map(match => (
                                            <div key={match.id} className="flex items-center justify-between bg-gray-50 p-3 rounded-lg border hover:border-indigo-300 transition text-right">
                                                <div className="text-right">
                                                    <div className="font-bold text-indigo-800">{match.title}</div>
                                                    <div className="text-xs font-mono bg-gray-200 px-1 rounded inline-block" dir="ltr">{match.id}</div>
                                                    <span className="text-xs text-gray-500 mr-2">{match.matchDate}</span>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button 
                                                        onClick={() => { setBookingId(match.id); setView('BOOKING'); safePushState({}, '', `?id=${match.id}`); }} 
                                                        className="px-3 py-1 bg-blue-100 text-blue-700 rounded text-xs font-bold hover:bg-blue-200"
                                                    >
                                                        زيارة
                                                    </button>
                                                    <button 
                                                        onClick={() => deleteBookingCompletely(match.id)} 
                                                        className="px-3 py-1 bg-red-100 text-red-700 rounded text-xs font-bold hover:bg-red-200"
                                                    >
                                                        حذف
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="mt-4 pt-2 border-t text-xs text-gray-400">
                                إجمالي المباريات: {allMatches.length}
                            </div>
                        </div>
                    ) : (
                        !showCreateModal ? (
                            <div className="bg-white/95 w-full max-w-md p-6 rounded-2xl shadow-2xl text-center relative z-10" dir="rtl">
                                <h1 
                                    className="text-3xl font-bold text-indigo-900 mb-6 flex items-center justify-center gap-2 cursor-default select-none"
                                    onClick={handleTitleClick}
                                >
                                     إدارة الملاعب
                                </h1>

                                <div className="grid gap-4">
                                    <button onClick={startCreateProcess} disabled={!user} className="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:from-indigo-700 hover:to-blue-700 transition transform hover:scale-[1.02] flex items-center justify-center gap-3">
                                        <div className="bg-white/20 p-2 rounded-full"><Icons.UserPlus size={24}/></div>
                                        <div className="text-right">
                                            <div className="text-lg leading-none">إنشاء حجز جديد</div>
                                            <div className="text-xs font-normal opacity-80">أنا المشرف</div>
                                        </div>
                                    </button>

                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 text-right">
                                        <div className="font-bold text-gray-700 mb-2 flex items-center gap-2"><Icons.Search size={18}/> الانضمام لمباراة</div>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                className="flex-1 p-3 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 text-black uppercase tracking-wider font-mono text-left" 
                                                placeholder="أدخل الرمز"
                                                value={joinCodeInput}
                                                onChange={e => setJoinCodeInput(e.target.value)}
                                            />
                                            <button onClick={joinMatch} className="bg-gray-800 text-white px-6 rounded-lg font-bold hover:bg-black">دخول</button>
                                        </div>
                                    </div>
                                </div>

                                {myBookings.length > 0 && (
                                    <div className="text-right mt-8">
                                        <div className="text-xs font-bold text-gray-400 mb-2 flex justify-between items-center"><span>السجل</span><button onClick={clearAllHistory} className="text-red-500 hover:underline">مسح الكل</button></div>
                                        <div className="space-y-2 max-h-40 overflow-y-auto">
                                            {myBookings.map((b, i) => (
                                                <div key={i} className="flex items-center gap-2 bg-slate-100 p-2 rounded-lg border border-slate-200 hover:bg-white transition">
                                                    <button onClick={() => { setBookingId(b.id); setView('BOOKING'); const url=`?id=${b.id}`; safePushState({path:url},'',url); }} className="flex-1 text-right">
                                                        <div className="font-bold text-indigo-900 text-sm truncate">{b.title || 'مباراة'}</div>
                                                        <span className="font-mono text-gray-400 text-xs" dir="ltr">#{b.id}</span>
                                                        <span className="text-xs text-gray-500 mr-2">{b.date}</span>
                                                    </button>
                                                    <button onClick={() => deleteHistory(i)} className="text-gray-400 hover:text-red-600 p-2"><Icons.Trash2 size={16}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="bg-white/95 w-full max-w-md p-6 rounded-2xl shadow-2xl relative z-10" dir="rtl">
                                <h2 className="text-xl font-bold text-indigo-900 mb-4 flex items-center gap-2"><Icons.Settings size={20}/> تفاصيل الحجز</h2>
                                
                                <div className="mb-4 text-right">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">اسم المباراة</label>
                                    <input type="text" className="w-full p-3 border rounded-lg text-black outline-none focus:border-indigo-500 text-right" value={newBookingConfig.title} onChange={e => setNewBookingConfig({...newBookingConfig, title: e.target.value})} placeholder="مثال: مباراة الخميس"/>
                                </div>

                                <div className="mb-4 text-right">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">الرمز السري للمباراة (اختياري)</label>
                                    <div className="flex gap-2 items-center" dir="ltr">
                                        <div className="bg-gray-100 p-2 rounded text-gray-500 font-mono text-sm">#</div>
                                        <input 
                                            type="text" 
                                            className="w-full p-3 border rounded-lg text-black outline-none focus:border-indigo-500 font-mono uppercase" 
                                            value={newBookingConfig.customId} 
                                            onChange={e => setNewBookingConfig({...newBookingConfig, customId: e.target.value})} 
                                            placeholder="تلقائي"
                                        />
                                    </div>
                                </div>

                                <div className="mb-6 text-right">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">كلمة مرور المشرف</label>
                                    <div className="relative flex items-center" dir="ltr">
                                        <input 
                                            type={createPassShow ? "text" : "password"} 
                                            className="w-full p-3 border rounded-lg text-black outline-none focus:border-indigo-500 pl-10 text-right" 
                                            value={newBookingConfig.password} 
                                            onChange={e => setNewBookingConfig({...newBookingConfig, password: e.target.value})} 
                                            placeholder="8 خانات، حرف كبير وصغير ورقم"
                                        />
                                        <button 
                                            onClick={() => setCreatePassShow(!createPassShow)}
                                            className="absolute left-2 text-gray-500 hover:text-gray-700"
                                        >
                                            {createPassShow ? <Icons.EyeOff size={18}/> : <Icons.Eye size={18}/>}
                                        </button>
                                    </div>
                                    <p className="text-[10px] text-gray-400 mt-1">ستحتاجها لاحقاً لإدارة هذا الحجز.</p>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setShowCreateModal(false)} className="flex-1 py-3 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200">إلغاء</button>
                                    <button onClick={confirmCreateBooking} className="flex-1 py-3 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700">إنشاء</button>
                                </div>
                            </div>
                        )
                    )}

                    {toast && <div className={`fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] px-6 py-3 rounded-lg shadow-2xl border flex items-center gap-2 animate-fade-in whitespace-nowrap ${toast.type === 'error' ? 'bg-red-600 border-red-700 text-white' : 'bg-green-600 border-green-700 text-white'}`}>{toast.type === 'error' ? <Icons.X size={20}/> : <Icons.Check size={20}/>}<span className="font-bold text-sm" dir="rtl">{toast.msg}</span></div>}
                </div>
            );

            // BOOKING VIEW RENDER
            const sorted = players.sort((a,b) => a.createdAt - b.createdAt);
            const activeList = sorted.slice(0, config.maxPlayers);
            const waitList = sorted.slice(config.maxPlayers);
            const cost = config.maxPlayers > 0 ? (config.totalCost / config.maxPlayers).toFixed(2) : 0;
            const myEntry = user && players.find(p => p.createdBy === user.uid);
            const deadlineStr = `${config.matchDate}T${config.withdrawalTime}`;
            const deadline = new Date(deadlineStr).getTime();
            const isDeadlinePassed = !isNaN(deadline) && Date.now() > deadline;

            return (
                <div className="min-h-screen pb-20 bg-black/50 backdrop-blur-sm content-padding" dir="rtl">
                    {toast && <div className={`fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] px-6 py-3 rounded-lg shadow-2xl border flex items-center gap-2 animate-fade-in whitespace-nowrap ${toast.type === 'error' ? 'bg-red-600 border-red-700 text-white' : 'bg-green-600 border-green-700 text-white'}`}>{toast.type === 'error' ? <Icons.X size={20}/> : <Icons.Check size={20}/>}<span className="font-bold text-sm">{toast.msg}</span></div>}

                    <div className="sticky-header bg-indigo-900/95 text-white p-4 shadow-lg backdrop-blur-md border-b border-indigo-800">
                        <div className="max-w-md mx-auto flex justify-between items-center">
                            <div className="flex-1 min-w-0 pl-2">
                                <h1 className="font-bold text-lg truncate">{config.title}</h1>
                                <div className="text-xs opacity-75 flex gap-2 items-center"><Icons.Calendar size={12}/> {config.matchDate} <span className="mx-1">|</span> <Icons.Clock size={12}/> {formatTime(config.startTime)}</div>
                                
                                {/* COUNTDOWN TIMER */}
                                {timeLeft && <div className="text-[10px] font-bold text-yellow-300 mt-1 animate-pulse" dir="ltr">⏳ {timeLeft}</div>}
                                
                                {/* Match Code Display */}
                                <div className="flex items-center gap-2 mt-1 bg-black/20 w-fit px-2 py-0.5 rounded cursor-pointer hover:bg-black/40 transition" onClick={copyCode} dir="ltr">
                                    <span className="text-[10px] font-mono text-indigo-200">CODE:</span>
                                    <span className="text-xs font-bold font-mono text-white">{bookingId}</span>
                                    <Icons.Copy size={10} className="text-indigo-300"/>
                                </div>
                            </div>
                            <div className="flex gap-3 items-center flex-shrink-0" dir="ltr">
                                <button onClick={goHome} className="p-2 bg-white/10 rounded-full hover:bg-white/20 transition"><Icons.Home size={20}/></button>
                                <button onClick={copyLink} className="p-2 bg-white/10 rounded-full hover:bg-white/20 transition relative"><Icons.Share size={20}/>{shareMsg && <span className="absolute -bottom-8 right-0 bg-black text-xs px-2 py-1 rounded">{shareMsg}</span>}</button>
                                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowAdminAuth(!showAdminAuth)} className={`p-2 rounded-full border-2 shadow-md transition ${isAdmin?'bg-yellow-400 text-black border-yellow-500':'bg-white text-black border-gray-300 hover:scale-105'}`}>
                                    {isAdmin ? <Icons.Unlock size={20}/> : <Icons.Lock size={20}/>}
                                </button>
                            </div>
                        </div>
                        {!isAdmin && showAdminAuth && (
                            <div className="max-w-md mx-auto mt-3 flex gap-2 admin-panel bg-white p-2 rounded-lg shadow-xl animate-fade-in" dir="ltr">
                                <div className="relative flex-1 flex items-center">
                                    <input type={showPassword ? "text" : "password"} placeholder="كلمة المرور" className="w-full p-2 border rounded text-black outline-none pr-10 text-right" value={passwordInput} onChange={e=>setPasswordInput(e.target.value)}/>
                                    <button onClick={() => setShowPassword(!showPassword)} className="absolute right-2 text-gray-500 hover:text-gray-700">{showPassword ? <Icons.EyeOff size={18}/> : <Icons.Eye size={18}/>}</button>
                                </div>
                                <button onClick={adminLogin} className="bg-indigo-900 text-white px-4 rounded font-bold hover:bg-indigo-800">دخول</button>
                            </div>
                        )}
                        {showManualShare && (
                             <div className="max-w-md mx-auto mt-3 bg-white p-2 rounded text-black flex gap-2" dir="ltr"><input readOnly value={window.location.href} className="flex-1 text-xs border p-1"/><button onClick={()=>setShowManualShare(false)}><Icons.X size={16}/></button></div>
                        )}
                    </div>

                    <div className="max-w-md mx-auto p-4 space-y-4 mt-4">
                        {config.location && (
                            <a href={config.location} target="_blank" rel="noopener noreferrer" className="block bg-blue-600/90 text-white p-3 rounded-xl shadow-lg flex items-center justify-center gap-2 hover:bg-blue-700 transition font-bold">
                                <Icons.MapPin size={20} /> 📍 موقع الملعب
                            </a>
                        )}

                        <div className="bg-white/95 rounded-xl p-4 shadow-xl text-center flex justify-between divide-x divide-x-reverse mt-2">
                            <div className="flex-1"><div className="text-xs text-gray-500 font-bold">المقاعد</div><div className={`font-bold text-lg ${activeList.length>=config.maxPlayers?'text-red-500':'text-indigo-900'}`}>{activeList.length}/{config.maxPlayers}</div></div>
                            <div className="flex-1"><div className="text-xs text-gray-500 font-bold">للشخص</div><div className="font-bold text-emerald-600 text-lg" dir="ltr">{cost} {config.currency}</div></div>
                            <div className="flex-1"><div className="text-xs text-gray-500 font-bold">المجموع</div><div className="font-bold text-indigo-900 text-lg" dir="ltr">{config.totalCost} {config.currency}</div></div>
                        </div>
                        
                        {isDeadlinePassed && <div className="bg-red-50 text-red-600 p-2 rounded text-center text-xs font-bold border border-red-200 flex items-center justify-center gap-2"><Icons.TimerOff size={14}/> وقت الانسحاب المسموح انتهى</div>}
                        
                        {config.paymentInfoImage && <div className="flex gap-2"><button onClick={()=>setViewImage(config.paymentInfoImage)} className="w-full bg-white/90 py-3 rounded-lg font-bold text-indigo-700 text-sm shadow flex justify-center gap-2 hover:bg-white transition"><Icons.CreditCard size={18}/> بيانات الدفع</button></div>}
                        
                        {isAdmin && (
                            <div className="bg-white/95 p-4 rounded-xl shadow-xl admin-panel space-y-4 border-2 border-yellow-400">
                                <div className="font-bold text-gray-800 border-b pb-2 flex justify-between items-center"><span>⚙️ تحكم المشرف</span></div>
                                <input type="text" value={config.title} onChange={e=>updateSetting('title', e.target.value)} className="w-full border p-2 rounded" placeholder="اسم المباراة"/>
                                
                                <div><label className="text-xs text-gray-500">موقع الملعب (Google Maps)</label><input type="text" value={config.location || ''} onChange={e=>updateSetting('location', e.target.value)} className="w-full border p-2 rounded text-left" dir="ltr" placeholder="https://..."/></div>

                                <div className="grid grid-cols-2 gap-2" dir="ltr"><input type="time" value={config.startTime} onChange={e=>updateSetting('startTime', e.target.value)} className="border p-2 rounded"/><input type="time" value={config.endTime} onChange={e=>updateSetting('endTime', e.target.value)} className="border p-2 rounded"/><input type="number" value={config.totalCost} onChange={e=>updateSetting('totalCost', Number(e.target.value))} className="border p-2 rounded" placeholder="Cost"/><input type="number" value={config.maxPlayers} onChange={e=>updateSetting('maxPlayers', Number(e.target.value))} className="border p-2 rounded" placeholder="Max Slots"/></div>
                                <div className="grid grid-cols-2 gap-2" dir="ltr">
                                    <div><label className="text-xs text-gray-500 text-right block">التاريخ</label><input type="date" value={config.matchDate} onChange={e=>updateSetting('matchDate', e.target.value)} className="w-full border p-2 rounded"/></div>
                                    <div><label className="text-xs text-red-500 font-bold text-right block">قفل الانسحاب</label><input type="datetime-local" value={config.withdrawalTime} onChange={e=>updateSetting('withdrawalTime', e.target.value)} className="w-full border p-2 rounded border-red-200"/></div>
                                </div>
                                <div className="flex items-center gap-2 bg-gray-100 p-2 rounded"><div className="text-xs font-bold text-gray-500">صورة للدفع:</div><input type="file" onChange={e=>uploadImage(e.target.files[0], 'paymentInfoImage')} className="text-xs w-full"/></div>
                                <div className="bg-gray-100 p-2 rounded mt-2"><div className="text-xs font-bold text-gray-500 mb-1">الرقم السري</div><div className="flex gap-2"><input type="text" value={newPasswordInput} onChange={e=>setNewPasswordInput(e.target.value)} className="flex-1 border p-1 rounded text-xs text-left" dir="ltr" placeholder="تغيير الرقم"/><button onClick={changeAdminPassword} className="bg-slate-800 text-white px-3 py-1 rounded text-xs font-bold">تحديث</button></div></div>
                                <div className="flex flex-col gap-2 pt-2">
                                    <div className="flex gap-2">
                                        <button onClick={()=>setShowTeamGen(true)} className="flex-1 bg-blue-500 text-white py-2 rounded text-sm font-bold shadow hover:bg-blue-600">تقسيم الفرق</button>
                                        <button onClick={resetPlayersList} className="flex-1 bg-orange-500 text-white py-2 rounded text-sm font-bold shadow hover:bg-orange-600">مسح اللاعبين</button>
                                    </div>
                                    <button onClick={() => deleteBookingCompletely(bookingId)} className="w-full bg-red-600 text-white py-2 rounded text-sm font-bold shadow hover:bg-red-700">حذف المباراة نهائياً</button>
                                </div>
                            </div>
                        )}
                        {myEntry && !isAdmin ? (
                            <div className="bg-emerald-100/95 p-4 rounded-xl border-2 border-emerald-400 text-center shadow-lg animate-fade-in">
                                <div className="text-emerald-800 font-bold text-lg">✅ أنت مسجل في المباراة!</div><div className="text-emerald-600 font-bold text-xl my-1">{myEntry.name}</div>
                                <div className="text-xs text-gray-600 mt-1">{myEntry.position} | {myEntry.level}</div>
                                <div className="mt-3 pt-3 border-t border-emerald-200 flex gap-2 justify-center"><label className="bg-white text-emerald-700 px-4 py-2 rounded-lg cursor-pointer font-bold text-xs hover:bg-emerald-50 shadow flex items-center gap-2"><Icons.Upload size={14}/> {myEntry.paymentProof ? 'تغيير' : 'إرفاق'} إيصال الدفع<input type="file" className="hidden" onChange={e=>uploadImage(e.target.files[0], 'proof', myEntry.id)} /></label>{myEntry.paymentProof && <button onClick={()=>setViewImage(myEntry.paymentProof)} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-emerald-700 shadow flex items-center gap-2"><Icons.Eye size={14}/> عرض</button>}</div>
                            </div>
                        ) : (
                            (!isAdmin && activeList.length >= config.maxPlayers) ? (
                                <form onSubmit={addPlayer} className="bg-orange-100/95 p-4 rounded-xl border-2 border-orange-300 shadow-lg"><div className="text-orange-800 font-bold mb-2 flex items-center gap-2">⚠️ القائمة ممتلئة! سجل في الاحتياط:</div>
                                    <input className="w-full p-3 mb-2 bg-white rounded-lg outline-none border border-orange-200 text-lg" placeholder="أدخل اسمك..." value={newName} onChange={e=>setNewName(e.target.value)}/>
                                    <div className="flex gap-2 mb-2">
                                        <select className="flex-1 p-2 bg-white border border-orange-200 rounded-lg outline-none text-sm text-gray-700" value={newPosition} onChange={e=>setNewPosition(e.target.value)}><option value="هجوم">هجوم ⚽</option><option value="وسط">وسط 🎯</option><option value="دفاع">دفاع 🛡️</option><option value="حارس">حارس 🧤</option></select>
                                        <select className="flex-1 p-2 bg-white border border-orange-200 rounded-lg outline-none text-sm text-gray-700" value={newLevel} onChange={e=>setNewLevel(e.target.value)}><option value="محترف">محترف ⭐️⭐️⭐️</option><option value="متوسط">متوسط ⭐️⭐️</option><option value="مبتدئ">مبتدئ ⭐️</option></select>
                                    </div>
                                    <button className="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 shadow">احتياط</button>
                                </form>
                            ) : (
                                <form onSubmit={addPlayer} className="bg-white/95 p-4 rounded-xl shadow-lg border-2 border-indigo-100 flex flex-col gap-3">
                                    <input className="w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-200 text-lg" placeholder={isAdmin ? "إضافة لاعب يدوياً..." : "أدخل اسمك..."} value={newName} onChange={e=>setNewName(e.target.value)}/>
                                    <div className="flex gap-2">
                                        <select className="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg outline-none text-sm text-gray-700" value={newPosition} onChange={e=>setNewPosition(e.target.value)}>
                                            <option value="هجوم">هجوم ⚽</option>
                                            <option value="وسط">وسط 🎯</option>
                                            <option value="دفاع">دفاع 🛡️</option>
                                            <option value="حارس">حارس 🧤</option>
                                        </select>
                                        <select className="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg outline-none text-sm text-gray-700" value={newLevel} onChange={e=>setNewLevel(e.target.value)}>
                                            <option value="محترف">محترف ⭐️⭐️⭐️</option>
                                            <option value="متوسط">متوسط ⭐️⭐️</option>
                                            <option value="مبتدئ">مبتدئ ⭐️</option>
                                        </select>
                                    </div>
                                    <button className="bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 shadow text-lg w-full">انضمام للمباراة</button>
                                </form>
                            )
                        )}
                        <div className="space-y-2">
                            {activeList.map((p, i) => (
                                <div key={p.id} className="bg-white/90 backdrop-blur-sm p-3 rounded-xl flex items-center justify-between shadow-sm border border-white/20">
                                    <div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-sm flex-shrink-0 ${p.isPaid?'bg-emerald-100 text-emerald-700':'bg-gray-200 text-gray-500'}`}>{i+1}</div>
                                    <div>
                                        <div className="font-bold text-gray-800 text-lg leading-none">{p.name}</div>
                                        <div className="flex gap-2 text-[10px] items-center mt-2 flex-wrap">
                                            {p.position && <span className="bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-bold border border-blue-100">{p.position} | {p.level}</span>}
                                            {isAdmin ? <button onClick={()=>togglePaid(p)} className={`px-2 py-0.5 rounded font-bold ${p.isPaid?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'}`}>{p.isPaid?'مدفوع':'غير مدفوع'}</button> : <span className={`font-bold ${p.isPaid?'text-emerald-600':'text-red-400'}`}>{p.isPaid?'مدفوع':'غير مدفوع'}</span>}
                                            {(p.paymentProof && (isAdmin || (user && user.uid === p.createdBy))) && <button onClick={()=>setViewImage(p.paymentProof)} className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded flex items-center gap-1 font-bold hover:bg-blue-100"><Icons.Image size={12}/> المرفق</button>}
                                        </div>
                                    </div></div>{(isAdmin || (user && user.uid === p.createdBy && !isDeadlinePassed)) && <button onClick={()=>deletePlayer(p.id)} className="text-gray-400 hover:text-red-500 p-2"><Icons.Trash2 size={20}/></button>}
                                </div>
                            ))}
                        </div>
                        {waitList.length > 0 && (
                            <div className="mt-6"><div className="text-white font-bold text-sm mb-2 opacity-90 uppercase">قائمة الاحتياط</div>{waitList.map((p, i) => (<div key={p.id} className="bg-orange-50/90 p-3 rounded-xl flex justify-between items-center mb-2 border border-orange-200 shadow-sm"><div className="flex items-center gap-3"><span className="font-bold text-orange-600 bg-orange-100 px-2 py-1 rounded text-xs flex-shrink-0">W-{i+1}</span>
                            <div>
                                <div className="font-bold text-slate-700 leading-none">{p.name}</div>
                                {p.position && <div className="text-[10px] text-gray-500 mt-1">{p.position} | {p.level}</div>}
                            </div>
                            </div>{(isAdmin || (user && user.uid === p.createdBy && !isDeadlinePassed)) && <button onClick={()=>deletePlayer(p.id)} className="text-orange-400 hover:text-red-500 p-2"><Icons.Trash2 size={18}/></button>}</div>))}</div>
                        )}
                        
                        {/* WhatsApp Share Button */}
                        <div className="mt-4 flex justify-center pb-6">
                            <button onClick={shareToWhatsApp} className="bg-[#25D366] text-white py-3 px-6 rounded-full font-bold shadow-lg flex items-center gap-2 hover:bg-[#20bd5a] transition transform hover:scale-105">
                                <Icons.Whatsapp size={24} /> إرسال في واتساب
                            </button>
                        </div>

                    </div>

                    {viewImage && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm" onClick={()=>setViewImage(null)}><img src={viewImage} className="max-w-full max-h-[80vh] rounded-lg shadow-2xl border-4 border-white"/></div>}
                    
                    {/* Team Generator Modal */}
                    {showTeamGen && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={()=>setShowTeamGen(false)}>
                        <div className="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl" onClick={e=>e.stopPropagation()}>
                            <div className="bg-indigo-600 p-4 text-white font-bold flex justify-between items-center">
                                <span className="flex items-center gap-2"><Icons.Activity size={20}/> التوزيع الذكي للفرق</span>
                                <button onClick={()=>setShowTeamGen(false)}><Icons.X size={24}/></button>
                            </div>
                            <div className="p-6 text-center">
                                <div className="text-xs text-gray-500 mb-4">يتم توزيع اللاعبين آلياً لموازنة الدفاع والهجوم والقوة</div>
                                <div className="flex items-center justify-center gap-6 mb-8">
                                    <button className="bg-gray-200 w-12 h-12 rounded-full font-bold text-2xl hover:bg-gray-300 flex items-center justify-center shadow" onClick={()=>setTeamCount(Math.max(2, teamCount-1))}>-</button>
                                    <div className="text-center">
                                        <span className="block font-bold text-3xl text-indigo-900">{teamCount}</span>
                                        <span className="text-xs text-gray-500 font-bold">عدد الفرق</span>
                                    </div>
                                    <button className="bg-gray-200 w-12 h-12 rounded-full font-bold text-2xl hover:bg-gray-300 flex items-center justify-center shadow" onClick={()=>setTeamCount(teamCount+1)}>+</button>
                                </div>
                                <button onClick={generateTeamsSmart} className="bg-indigo-600 text-white px-6 py-4 rounded-xl font-bold w-full shadow-lg hover:bg-indigo-700 text-lg">تقسيم ونسخ النتيجة</button>
                            </div>
                        </div>
                    </div>}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
